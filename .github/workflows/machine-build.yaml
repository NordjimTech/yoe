name: Machine Build

# Full from-source build of the Raspberry Pi 4 dev-image. This is the
# board-coverage tier: it catches BSP units, kernel defconfig, partition
# layout, and image assembly issues that the QEMU matrix cannot see.
#
# There is no boot test: these images target physical boards, and QEMU
# cannot stand in for them. The workflow verifies the image artifact exists,
# reports its partition table, and uploads the image for flashing to real
# hardware.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  machine-build:
    name: Machine Build (${{ matrix.machine }} / ${{ matrix.distro }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    strategy:
      # Surface every board's failure independently rather than cancelling
      # siblings on the first red cell.
      fail-fast: false
      matrix:
        include:
          - machine: raspberrypi4
            distro: alpine
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # A cold from-source build (toolchain, kernel, cache, container
          # image) needs more headroom than the runner ships with. The Android
          # SDK and CodeQL caches only exist on the x86_64 runner image, so
          # tolerate their absence on arm64.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Enable unprivileged user namespaces
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
          # which makes bwrap inside the build container fail with "setting up
          # uid map: Permission denied" even though the container is
          # --privileged.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build yoe
        run: |
          VERSION=$(git describe --tags HEAD 2>/dev/null || echo "dev")
          go build -ldflags "-X main.version=${VERSION}" -o yoe ./cmd/yoe

      - name: Cache yoe build cache
        uses: actions/cache@v4
        with:
          # Content-addressed objects, synced modules, and fetched sources.
          # The run-id key always saves a fresh cache; restore-keys pulls the
          # most recent prior cache so successive runs build incrementally.
          # The key is scoped per machine and distro so the cells do not
          # clobber one another's caches -- boards share a libc and toolchain
          # but differ in kernel, bootloader, and board packages.
          path: testdata/e2e-project/cache
          key: yoe-cache-${{ matrix.machine }}-${{ matrix.distro }}-${{ github.run_id }}
          restore-keys: |
            yoe-cache-${{ matrix.machine }}-${{ matrix.distro }}-

      # The build's implicit module sync only clones missing modules; it does
      # not advance an already-cached module to the latest commit on its branch
      # ref. Since the build cache (restored above) persists module checkouts
      # across runs, a branch-pinned module would stay frozen at whatever
      # commit it was first cloned at. An explicit sync fast-forwards every
      # cached module to its pinned ref before building.
      - name: Sync modules
        working-directory: testdata/e2e-project
        run: ../../yoe module sync

      - name: Build dev-image
        working-directory: testdata/e2e-project
        run: ../../yoe build -j "$(nproc)" --distro ${{ matrix.distro }} --machine ${{ matrix.machine }} dev-image

      - name: Verify image artifact
        working-directory: testdata/e2e-project
        run: |
          img=build/${{ matrix.distro }}/dev-image.${{ matrix.machine }}/destdir/dev-image.img
          if [ ! -s "$img" ]; then
            echo "::error::dev-image build produced no image at $img"
            exit 1
          fi
          ls -lh "$img"
          # Report the partition layout. A board image is only useful if its
          # boot and root partitions landed where the machine descriptor says,
          # and this is the closest check available without the hardware.
          sfdisk --list "$img" || true

      - name: Compress image
        working-directory: testdata/e2e-project
        run: |
          # A dev-image is a couple of GB of mostly-empty filesystem, which
          # zstd reduces by roughly 9x in a second or two -- worth doing before
          # it crosses the network. Decompress with `unzstd` (or `zstd -d`)
          # before flashing; `yoe flash` takes the decompressed .img.
          # zstd ships on the runner images, but do not let a two-hour build
          # go red at the last step if that ever changes.
          command -v zstd >/dev/null || sudo apt-get install -y --no-install-recommends zstd
          img=build/${{ matrix.distro }}/dev-image.${{ matrix.machine }}/destdir/dev-image.img
          out=dev-image-${{ matrix.machine }}-${{ matrix.distro }}.img.zst
          zstd -3 -T0 -f -o "$out" "$img"
          ls -lh "$out"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-image-${{ matrix.machine }}-${{ matrix.distro }}
          path: testdata/e2e-project/dev-image-${{ matrix.machine }}-${{ matrix.distro }}.img.zst
          # Already zstd-compressed, so skip the action's own zip pass.
          compression-level: 0
          # These are nightly regression builds, not releases. A week is long
          # enough to grab one and flash a board; keeping every night's seven
          # images indefinitely would grow without bound.
          retention-days: 7
          if-no-files-found: error
